services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: elite
      POSTGRES_USER: elite
      POSTGRES_PASSWORD: elite
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elite -d elite"]
      interval: 5s
      timeout: 5s
      retries: 10

  db_test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: elite_test
      POSTGRES_USER: elite_test
      POSTGRES_PASSWORD: elite_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elite_test -d elite_test"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
