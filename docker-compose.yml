services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: elite
      POSTGRES_USER: elite
      POSTGRES_PASSWORD: elite
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elite -d elite"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

